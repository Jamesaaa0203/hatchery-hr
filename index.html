<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hatchery HR Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { transition: background-color 0.2s, color 0.2s; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

  <header class="p-4 border-b bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i data-lucide="waves" class="text-blue-600 w-6 h-6"></i>
      <h1 class="text-lg font-bold tracking-tight dark:text-white">Hatchery HR Pro</h1>
    </div>
    <span id="themeBadge" class="text-xs px-2.5 py-1 rounded-full font-medium"></span>
  </header>

  <nav class="flex bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 text-sm">
    <button onclick="switchTab('ot-tab')" id="ot-tab-btn" class="flex-1 py-3 text-center font-semibold border-b-2 border-blue-600 text-blue-600 dark:text-blue-400">
      Log OT
    </button>
    <button onclick="switchTab('leave-tab')" id="leave-tab-btn" class="flex-1 py-3 text-center font-semibold border-b-2 border-transparent text-slate-500">
      Apply Leave
    </button>
    <button onclick="switchTab('mgr-tab')" id="mgr-tab-btn" class="flex-1 py-3 text-center font-semibold border-b-2 border-transparent text-slate-500 flex justify-center items-center gap-1">
      <i data-lucide="shield-check" class="w-4 h-4"></i> Manager
    </button>
  </nav>

  <main class="p-4 max-w-xl mx-auto pb-16">

    <!-- OVERTIME LOGGING MODULE -->
    <div id="ot-tab" class="tab-content active">
      <form id="otForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-600 dark:text-slate-400">Operator Name</label>
          <input type="text" id="ot_name" required class="w-full p-3 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-600 dark:text-slate-400">Day Designation</label>
            <select id="ot_day_type" class="w-full p-3 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="normal">Normal Working Day</option>
              <option value="off">Rest Day / Off Day</option>
              <option value="public">Public Holiday</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-600 dark:text-slate-400">OT Windows</label>
            <select id="ot_shift_type" onchange="toggleOTFields()" class="w-full p-3 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="Same Day">Standard Same Day</option>
              <option value="Overnight">Overnight / Cross-Day</option>
            </select>
          </div>
        </div>

        <!-- Dynamic Group Switching -->
        <div id="wrapper_same_day" class="p-4 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1 dark:text-slate-300">Work Date</label>
            <input type="date" id="ot_date_single" class="w-full p-2.5 rounded bg-white dark:bg-slate-700 dark:text-white border dark:border-slate-600">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1 dark:text-slate-300">Total OT Hours</label>
            <input type="number" id="ot_hours_raw" step="0.5" placeholder="e.g. 2.5" class="w-full p-2.5 rounded bg-white dark:bg-slate-700 dark:text-white border dark:border-slate-600">
          </div>
        </div>

        <div id="wrapper_overnight" class="hidden p-4 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1 dark:text-slate-300">Start Date & Time</label>
            <input type="datetime-local" id="ot_start" class="w-full p-2.5 rounded bg-white dark:bg-slate-700 dark:text-white border dark:border-slate-600">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1 dark:text-slate-300">End Date & Time</label>
            <input type="datetime-local" id="ot_end" class="w-full p-2.5 rounded bg-white dark:bg-slate-700 dark:text-white border dark:border-slate-600">
          </div>
        </div>

        <button type="button" onclick="submitForm('OT')" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-lg shadow hover:bg-blue-700 active:scale-98 transition flex justify-center items-center gap-2">
          <i data-lucide="send" class="w-4 h-4"></i> Secure Submit to Sheet
        </button>
      </form>
    </div>

    <!-- LEAVE APPLICATION MODULE -->
    <div id="leave-tab" class="tab-content">
      <form id="leaveForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-600 dark:text-slate-400">Operator Name</label>
          <input type="text" id="leave_name" required class="w-full p-3 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-600 dark:text-slate-400">Leave Type</label>
          <select id="leave_type" class="w-full p-3 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Annual Leave">Annual Leave</option>
            <option value="Medical Leave">Medical Leave</option>
            <option value="Emergency Leave">Emergency Leave</option>
            <option value="Unpaid Leave">Unpaid Leave</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-600 dark:text-slate-400">Start Date</label>
            <input type="date" id="leave_start" required class="w-full p-3 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-600 dark:text-slate-400">Total Days</label>
            <!-- Changed to days input instead of end date -->
            <input type="number" id="leave_days" min="0.5" step="0.5" placeholder="e.g. 1.5" required class="w-full p-3 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-600 dark:text-slate-400">Reason</label>
          <textarea id="leave_reason" rows="3" required class="w-full p-3 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>

        <button type="button" onclick="submitForm('Leave')" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-lg shadow hover:bg-blue-700 active:scale-98 transition flex justify-center items-center gap-2">
          <i data-lucide="calendar" class="w-4 h-4"></i> Log Leave Request
        </button>
      </form>
    </div>

    <!-- MANAGER EXECUTIVE TERMINAL -->
    <div id="mgr-tab" class="tab-content">
      <div id="gatekeeper_panel" class="text-center p-8 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl max-w-sm mx-auto space-y-4">
        <i data-lucide="lock" class="w-8 h-8 text-amber-500 mx-auto"></i>
        <h3 class="text-md font-bold dark:text-white">Identity Terminal Credentials</h3>
        <input type="password" id="mgr_pin" placeholder="Enter PIN (3653)" class="w-full p-3 text-center text-lg tracking-widest rounded border dark:border-slate-700 dark:bg-slate-800 dark:text-white">
        <button type="button" onclick="unlockDashboard()" class="w-full py-2.5 bg-slate-900 dark:bg-blue-600 text-white font-bold rounded shadow">Authenticate</button>
      </div>

      <div id="dashboard_panel" class="hidden space-y-6">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-black tracking-tight dark:text-white">Live Performance Log</h2>
          <button onclick="fetchSheetData()" class="p-2 rounded bg-slate-200 dark:bg-slate-800 dark:text-white text-xs font-semibold flex items-center gap-1">
            <i data-lucide="refresh-cw" class="w-3 h-3"></i> Sync
          </button>
        </div>

        <div class="space-y-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Overtime Overview</h3>
          <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold border-b border-slate-200 dark:border-slate-800">
                  <th class="p-3 whitespace-nowrap">Operator</th>
                  <th class="p-3 whitespace-nowrap">Day Type</th>
                  <th class="p-3 whitespace-nowrap">Hours</th>
                  <th class="p-3 whitespace-nowrap">Rule Applied</th>
                  <th class="p-3 whitespace-nowrap">Payable Hours</th>
                  <th class="p-3 whitespace-nowrap">Timeline Info</th>
                </tr>
              </thead>
              <tbody id="table_ot_body" class="divide-y divide-slate-100 dark:divide-slate-800 dark:text-slate-300">
                <tr><td colspan="6" class="p-4 text-center text-slate-400">Awaiting sync...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="space-y-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Leave Ledger View</h3>
          <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold border-b border-slate-200 dark:border-slate-800">
                  <th class="p-3 whitespace-nowrap">Operator</th>
                  <th class="p-3 whitespace-nowrap">Leave Category</th>
                  <th class="p-3 whitespace-nowrap">Start Date</th>
                  <th class="p-3 whitespace-nowrap">Total Days</th>
                  <th class="p-3 whitespace-nowrap">Reason</th>
                </tr>
              </thead>
              <tbody id="table_leave_body" class="divide-y divide-slate-100 dark:divide-slate-800 dark:text-slate-300">
                <tr><td colspan="5" class="p-4 text-center text-slate-400">Awaiting sync...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // REPLACE THIS URL WITH YOUR NEW GOOGLE APPS SCRIPT DEPLOYMENT URL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzGunqr_-X6YExc7P-M8HBWLBQD9oJe2jLqu4thp1-Hw4wv2X6ZGU9NZTWzt3BA8AILTQ/exec"; 
    const DRAFT_KEY = "hatchery_hr_v2_cache";
    const MASTER_PIN = "3653";

    function applyTheme() {
      const hr = new Date().getHours();
      const night = (hr >= 18 || hr < 6);
      const b = document.getElementById("themeBadge");
      if(night) {
        document.documentElement.classList.add('dark');
        document.body.className = "bg-slate-950 text-slate-100 font-sans min-h-screen";
        b.innerText = "Night Shift";
        b.className = "text-xs px-2.5 py-1 rounded-full font-medium bg-slate-800 text-slate-300 border border-slate-700";
      } else {
        document.documentElement.classList.remove('dark');
        document.body.className = "bg-slate-50 text-slate-900 font-sans min-h-screen";
        b.innerText = "Day Ops Mode";
        b.className = "text-xs px-2.5 py-1 rounded-full font-medium bg-blue-100 text-blue-800";
      }
    }

    function switchTab(id) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      const tabs = ['ot-tab', 'leave-tab', 'mgr-tab'];
      tabs.forEach(t => {
        const btn = document.getElementById(t + '-btn');
        if(t === id) {
          btn.className = "flex-1 py-3 text-center font-bold border-b-2 border-blue-600 text-blue-600 dark:text-blue-400";
        } else {
          btn.className = "flex-1 py-3 text-center font-semibold border-b-2 border-transparent text-slate-500";
        }
      });
    }

    function toggleOTFields() {
      const type = document.getElementById("ot_shift_type").value;
      if (type === "Same Day") {
        document.getElementById("wrapper_same_day").classList.remove("hidden");
        document.getElementById("wrapper_overnight").classList.add("hidden");
      } else {
        document.getElementById("wrapper_same_day").classList.add("hidden");
        document.getElementById("wrapper_overnight").classList.remove("hidden");
      }
    }

    function unlockDashboard() {
      const pin = document.getElementById("mgr_pin").value;
      if(pin === MASTER_PIN) {
        document.getElementById("gatekeeper_panel").classList.add("hidden");
        document.getElementById("dashboard_panel").classList.remove("hidden");
        fetchSheetData();
      } else {
        alert("Access Denied. Incorrect PIN.");
      }
    }

    function cacheState() {
      const state = {
        otName: document.getElementById("ot_name").value,
        otDayType: document.getElementById("ot_day_type").value,
        otShiftType: document.getElementById("ot_shift_type").value,
        otDateSingle: document.getElementById("ot_date_single").value,
        otHoursRaw: document.getElementById("ot_hours_raw").value,
        otStart: document.getElementById("ot_start").value,
        otEnd: document.getElementById("ot_end").value,
        lName: document.getElementById("leave_name").value,
        lType: document.getElementById("leave_type").value,
        lStart: document.getElementById("leave_start").value,
        lDays: document.getElementById("leave_days").value,
        lReason: document.getElementById("leave_reason").value,
      };
      localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
    }

    function pullCache() {
      const cache = localStorage.getItem(DRAFT_KEY);
      if(!cache) return;
      const data = JSON.parse(cache);
      document.getElementById("ot_name").value = data.otName || "";
      document.getElementById("ot_day_type").value = data.otDayType || "normal";
      document.getElementById("ot_shift_type").value = data.otShiftType || "Same Day";
      document.getElementById("ot_date_single").value = data.otDateSingle || "";
      document.getElementById("ot_hours_raw").value = data.otHoursRaw || "";
      document.getElementById("ot_start").value = data.otStart || "";
      document.getElementById("ot_end").value = data.otEnd || "";
      document.getElementById("leave_name").value = data.lName || "";
      document.getElementById("leave_type").value = data.lType || "Annual Leave";
      document.getElementById("leave_start").value = data.lStart || "";
      document.getElementById("leave_days").value = data.lDays || "";
      document.getElementById("leave_reason").value = data.lReason || "";
      toggleOTFields();
    }

    async function submitForm(type) {
      if(WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE")) {
        alert("Error: You forgot to paste the Web App URL into the HTML code."); return;
      }
      
      let payload = { formType: type };
      
      if(type === "OT") {
        payload.employeeName = document.getElementById("ot_name").value;
        payload.dayType = document.getElementById("ot_day_type").value;
        payload.shiftType = document.getElementById("ot_shift_type").value;
        payload.dateSingle = document.getElementById("ot_date_single").value;
        payload.rawHours = document.getElementById("ot_hours_raw").value;
        payload.startTime = document.getElementById("ot_start").value;
        payload.endTime = document.getElementById("ot_end").value;
        if(!payload.employeeName) { alert("Please enter Operator Name."); return; }
      } else {
        payload.employeeName = document.getElementById("leave_name").value;
        payload.leaveType = document.getElementById("leave_type").value;
        payload.startDate = document.getElementById("leave_start").value;
        payload.durationDays = document.getElementById("leave_days").value;
        payload.reason = document.getElementById("leave_reason").value;
        if(!payload.employeeName || !payload.startDate || !payload.durationDays) { alert("Missing required leave inputs."); return; }
      }

      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        
        alert("Success: Log saved to Google Sheets!");
        document.getElementById(type === "OT" ? "otForm" : "leaveForm").reset();
        cacheState();
        toggleOTFields();
      } catch(e) {
        alert("Connection failed: Please check your internet or Web App URL.");
      }
    }

    async function fetchSheetData() {
      try {
        const res = await fetch(WEB_APP_URL);
        const data = await res.json();
        
        const otBody = document.getElementById("table_ot_body");
        otBody.innerHTML = data.ot.length ? data.ot.map(row => `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-800">
            <td class="p-3 font-semibold">${row[1] || ''}</td>
            <td class="p-3 uppercase tracking-tight text-slate-500">${row[2] || ''}</td>
            <td class="p-3">${row[4] || ''} h</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-mono text-[10px]">${row[5] || ''}</span></td>
            <td class="p-3 text-blue-600 dark:text-blue-400 font-bold">${row[6] || ''} h</td>
            <td class="p-3 text-slate-400 text-[11px] truncate max-w-[120px]">${row[8] || row[3] || ''}</td>
          </tr>
        `).join('') : `<tr><td colspan="6" class="p-4 text-center">No records found.</td></tr>`;

        const leaveBody = document.getElementById("table_leave_body");
        leaveBody.innerHTML = data.leave.length ? data.leave.map(row => `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-800">
            <td class="p-3 font-semibold">${row[1] || ''}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-[11px] font-medium bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-300">${row[2] || ''}</span></td>
            <td class="p-3 text-slate-500">${row[3] || ''}</td>
            <td class="p-3 font-bold text-slate-700 dark:text-slate-300">${row[4] || ''} Day(s)</td>
            <td class="p-3 text-slate-600 dark:text-slate-400 truncate max-w-[150px]" title="${row[5] || ''}">${row[5] || ''}</td>
          </tr>
        `).join('') : `<tr><td colspan="5" class="p-4 text-center">No records found.</td></tr>`;

      } catch(e) {
        console.error("Dashboard failed to load:", e);
        alert("Failed to load dashboard data. Ensure your Web App URL is correct and deployed securely.");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      applyTheme();
      pullCache();
      lucide.createIcons();
      document.querySelectorAll("input, select, textarea").forEach(el => {
        el.addEventListener("input", cacheState);
      });
    });
  </script>
</body>
</html>
